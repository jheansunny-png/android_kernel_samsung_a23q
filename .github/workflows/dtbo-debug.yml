name: Teste Rapido DTBO (diagnostico)

on:
  workflow_dispatch:

env:
  DEFCONFIG: rsuntk_defconfig

jobs:
  dtbo-debug:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl wget zip cpio git python3

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: proton-clang-v1

      - name: Download Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Prepare (defconfig + scripts)
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          rm -rf out
          mkdir -p out
          make O=out ARCH=arm64 $DEFCONFIG
          make O=out ARCH=arm64 olddefconfig
          make O=out ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) prepare scripts

      - name: Diagnostico profundo do DTS
        shell: bash
        run: |
          set +e
          DTS=arch/arm64/boot/dts/samsung/a23/a23/a23_eur_open_w00_r00.dts

          echo "=== Onde esta o 'See more detail' (wrapper da Samsung) ==="
          grep -rn "See more detail" scripts/ Makefile arch/arm64/Makefile 2>/dev/null
          echo "--- contexto em Makefile.lib ---"
          grep -n -B6 -A6 "See more detail" scripts/Makefile.lib 2>/dev/null

          echo "=== Linhas #include e /include/ do DTS ==="
          grep -nE '^\s*(#include|/include/)' "$DTS"

          echo "=== Pasta vendor existe fora do kernel? ==="
          ls -d vendor vendor/qcom ../vendor ../vendor/qcom 2>&1 | head

          echo "=== Conteudo do Makefile do a23 ==="
          cat arch/arm64/boot/dts/samsung/a23/a23/Makefile

          echo "=== Preprocessador (cpp) no DTS: mostra includes faltando ==="
          cpp -nostdinc -I arch/arm64/boot/dts -I arch/arm64/boot/dts/samsung \
            -I arch/arm64/boot/dts/samsung/a23 -I include -undef -x assembler-with-cpp \
            "$DTS" > /tmp/a23.dts.tmp 2> /tmp/cpp.err
          echo "codigo de saida do cpp: $?"
          head -30 /tmp/cpp.err

          echo "=== dtc no resultado (mostra o erro real do dtc) ==="
          out/scripts/dtc/dtc -@ -I dts -O dtb -o /tmp/a23.dtbo /tmp/a23.dts.tmp 2>&1 | head -40
          exit 0

      - name: Compilar dtbs sem paralelismo (V=1)
        shell: bash
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          set +e
          make O=out ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j1 V=1 dtbs 2>&1 | tee dtbs.log
          echo "=== Ultimas 80 linhas ==="
          tail -80 dtbs.log
          echo "=== Primeiras ocorrencias de erro ==="
          grep -nE "error|Error|No such file|not found" dtbs.log | head -20 || true
          exit 0

      - name: Upload dtbs log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-log
          path: dtbs.log
          if-no-files-found: ignore
