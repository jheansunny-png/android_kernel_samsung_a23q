name: Build TrueKris Kernel A23 4G

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl wget zip cpio git python3

      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Integrate KernelSU
        run: |
          # Confirme se esse link ainda existe no repositório oficial
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          # Confere se o defconfig existe antes de editar
          if [ ! -f arch/arm64/configs/truekris_defconfig ]; then
            echo "ERRO: truekris_defconfig não encontrado em arch/arm64/configs/"
            ls arch/arm64/configs/ | head -50
            exit 1
          fi

          echo "CONFIG_KSU=y" >> arch/arm64/configs/truekris_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/truekris_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/truekris_defconfig

      - name: Build the Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"

          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 truekris_defconfig
          make O=out ARCH=arm64 olddefconfig

          make O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) 2>&1 | tee build.log

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: TrueKris-Kernel-A23-KSU
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
