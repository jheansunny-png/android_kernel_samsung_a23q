name: Build TrueKris Kernel A23 4G

on:
  workflow_dispatch:

env:
  DEFCONFIG: rsuntk_defconfig

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl wget zip cpio git python3 ccache

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: proton-clang-v1

      - name: Download Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Check Defconfig
        run: |
          if [ ! -f arch/arm64/configs/$DEFCONFIG ]; then
            echo "ERRO: $DEFCONFIG não encontrado"
            ls arch/arm64/configs/
            exit 1
          fi
          grep -n "CONFIG_KSU" arch/arm64/configs/$DEFCONFIG || echo "KSU não está no defconfig"
          ls -d drivers/kernelsu KernelSU* 2>/dev/null || echo "KernelSU ainda não integrado"

      - name: Integrate KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Patch KernelSU-Next (compat 4.19)
        run: |
          # 1) sulog.h: falta o include de __init/__exit
          F=drivers/kernelsu/feature/sulog.h
          if [ -f "$F" ]; then
            grep -q "linux/init.h" "$F" || sed -i '1i #include <linux/init.h>' "$F"
          else
            echo "ERRO: $F não encontrado"
            ls -la drivers/kernelsu/ || true
            exit 1
          fi

          # 2) linux/pgtable.h não existe no 4.19, o equivalente é asm/pgtable.h
          grep -RlE "linux/pgtable.h" drivers/kernelsu/ | while read -r f; do
            echo "Patch pgtable: $f"
            sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g' "$f"
          done

          # 3) strncpy_from_user_nofault (5.8+) -> strncpy_from_unsafe_user (4.19)
          if grep -q "strncpy_from_unsafe_user" include/linux/uaccess.h; then
            echo "strncpy_from_unsafe_user existe no source, aplicando patch"
            grep -RlE "strncpy_from_user_nofault" drivers/kernelsu/ | while read -r f; do
              echo "Patch nofault: $f"
              sed -i 's/strncpy_from_user_nofault/strncpy_from_unsafe_user/g' "$f"
            done
          else
            echo "ERRO: strncpy_from_unsafe_user não existe em include/linux/uaccess.h"
            grep -rn "strncpy_from" include/linux/uaccess.h include/linux/*.h | head -20 || true
            exit 1
          fi

          # 4) Diagnóstico: outras funções de kernel novo usadas pelo KernelSU
          echo "=== Outras funcoes *_nofault usadas (podem dar erro depois) ==="
          grep -Rn "_nofault" drivers/kernelsu/ || echo "nenhuma"
          echo "=== Headers possivelmente ausentes no kernel 4.19 ==="
          grep -RhoE '#include <(linux|asm)/[^>]+>' drivers/kernelsu/ \
            | sed -E 's/#include <(.*)>/\1/' | sort -u | while read -r h; do
              if [ ! -f "include/$h" ] && [ ! -f "include/uapi/$h" ] \
                 && [ ! -f "arch/arm64/include/$h" ] && [ ! -f "arch/arm64/include/uapi/$h" ] \
                 && [ ! -f "include/asm-generic/${h#asm/}" ]; then
                echo "FALTA: $h"
              fi
            done
          echo "=== Fim do diagnostico ==="

      - name: Build the Kernel
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G

          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 $DEFCONFIG

          # KernelSU + performance (seguro)
          scripts/config --file out/.config \
            -e KSU \
            -e KPROBES -e KPROBE_EVENTS \
            -d CC_OPTIMIZE_FOR_SIZE -e CC_OPTIMIZE_FOR_PERFORMANCE \
            -e CPU_FREQ_GOV_SCHEDUTIL \
            -e TCP_CONG_BBR -e NET_SCH_FQ --set-str DEFAULT_TCP_CONG "bbr" \
            -e ZRAM -e CRYPTO_LZ4 -e CRYPTO_ZSTD \
            -d SCHED_DEBUG

          make O=out ARCH=arm64 olddefconfig

          echo "=== Configs efetivas ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES=|CC_OPTIMIZE|SCHEDUTIL|TCP_CONG_BBR|CONFIG_ZRAM=|LTO" out/.config || true

          make O=out ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) 2>&1 | tee build.log

      - name: Verify Kernel Image
        run: |
          echo "=== Arquivos gerados em boot/ ==="
          ls -lh out/arch/arm64/boot/ || true

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERRO: Image não foi gerado, o build falhou."
            exit 1
          fi

          SIZE=$(stat -c%s out/arch/arm64/boot/Image)
          echo "Tamanho do Image: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERRO: Image pequeno demais, algo está errado."
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: TrueKris-Kernel-A23-KSU
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
