name: Build TrueKris Kernel A23 4G

on:
  workflow_dispatch:

env:
  DEFCONFIG: rsuntk_defconfig
  # Se der erro de compatibilidade, troque por: v3.0.0-30-legacy
  KSU_REF: main

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl wget zip cpio git python3 ccache

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: proton-clang-v1

      - name: Download Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Check Defconfig
        run: |
          if [ ! -f arch/arm64/configs/$DEFCONFIG ]; then
            echo "ERRO: $DEFCONFIG não encontrado"
            ls arch/arm64/configs/
            exit 1
          fi

      - name: Check Hooks Before KernelSU (diagnostico)
        run: |
          echo "=== Referencias a ksu no source ANTES de integrar ==="
          grep -rniE "ksu_|CONFIG_KSU" fs/ security/ drivers/input/ kernel/ \
            --include=*.c --include=*.h 2>/dev/null | head -30 || true
          echo "=== KPROBES no defconfig? ==="
          grep -E "CONFIG_KPROBES|CONFIG_HAVE_KPROBES" arch/arm64/configs/$DEFCONFIG || echo "nao definido"
          echo "=== Fim do diagnostico ==="

      - name: Integrate KernelSU (rsuntk fork)
        run: |
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s $KSU_REF
          echo "=== Conteudo de drivers/kernelsu ==="
          ls -la drivers/kernelsu/ ||
