name: Build A23 4G (sem KernelSU)

on:
  workflow_dispatch:
    inputs:
      perf:
        description: "Ligar otimizacoes de performance? (true/false)"
        required: true
        default: "false"
      debug_mismatch:
        description: "Mostrar detalhes do section mismatch? (true/false)"
        required: true
        default: "true"

env:
  DEFCONFIG: rsuntk_defconfig

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl wget zip cpio git python3 ccache gdb

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: proton-clang-v1

      - name: Download Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-noksu-${{ github.sha }}
          restore-keys: ccache-

      - name: Check Defconfig
        run: |
          if [ ! -f arch/arm64/configs/$DEFCONFIG ]; then
            echo "ERRO: $DEFCONFIG nao encontrado"
            ls arch/arm64/configs/
            exit 1
          fi

      - name: Build the Kernel
        shell: bash
        env:
          PERF: ${{ github.event.inputs.perf }}
          DEBUG_MM: ${{ github.event.inputs.debug_mismatch }}
        run: |
          set -eo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G

          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 $DEFCONFIG

          # Section mismatch: nao fatal
          scripts/config --file out/.config -e SECTION_MISMATCH_WARN_ONLY
          if [ "$DEBUG_MM" = "true" ]; then
            scripts/config --file out/.config -e DEBUG_SECTION_MISMATCH
          fi

          if [ "$PERF" = "true" ]; then
            echo "=== Otimizacoes de performance LIGADAS ==="
            scripts/config --file out/.config \
              -d CC_OPTIMIZE_FOR_SIZE -e CC_OPTIMIZE_FOR_PERFORMANCE \
              -e CPU_FREQ_GOV_SCHEDUTIL \
              -e TCP_CONG_BBR -e NET_SCH_FQ --set-str DEFAULT_TCP_CONG "bbr" \
              -e ZRAM -e CRYPTO_LZ4 -e CRYPTO_ZSTD \
              -d SCHED_DEBUG
          else
            echo "=== Otimizacoes de performance DESLIGADAS (defconfig puro) ==="
          fi

          make O=out ARCH=arm64 olddefconfig

          echo "=== Configs efetivas ==="
          grep -E "CC_OPTIMIZE|SCHEDUTIL|TCP_CONG_BBR|CONFIG_ZRAM=|SECTION_MISMATCH" out/.config || true

          MAKE_ARGS="O=out ARCH=arm64 CC=\"ccache clang\" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          echo "=== Fase 1: compilando Image ==="
          eval make $MAKE_ARGS -j$(nproc --all) Image 2>&1 | tee build.log

          echo "=== Fase 2: compilando dtbs (nao fatal) ==="
          if ! eval make $MAKE_ARGS -j1 dtbs 2>&1 | tee -a build.log; then
            echo "AVISO: dtbs falharam, o Image foi gerado mesmo assim"
            touch dtbs_failed
          fi

      - name: Mostrar section mismatch
        if: always()
        run: |
          echo "=== Section mismatch encontrados no log ==="
          grep -n -A4 "Section mismatch" build.log || echo "nenhum encontrado no log"
          echo "=== Ultimas 30 linhas do log ==="
          tail -30 build.log || true

      - name: Diagnostico dtbo (so se os dtbs falharam)
        if: always() && hashFiles('dtbs_failed') != ''
        shell: bash
        run: |
          set +e
          export PATH="$HOME/clang/bin:$PATH"
          echo "=== Base DTB (khaje) no caminho certo ==="
          ls arch/arm64/boot/dts/vendor/qcom 2>&1 | grep -i khaje | head
          find . -iname "khaje*" -not -path "./out/*" 2>/dev/null | head -10
          cat .gitmodules 2>/dev/null || echo "sem .gitmodules"

          echo "=== dtc direto (sem head) ==="
          DTS=arch/arm64/boot/dts/samsung/a23/a23/a23_eur_open_w00_r00.dts
          cpp -nostdinc -I arch/arm64/boot/dts -I arch/arm64/boot/dts/samsung \
            -I arch/arm64/boot/dts/samsung/a23 -I include -undef -x assembler-with-cpp \
            "$DTS" > /tmp/a23.dts.tmp 2> /tmp/cpp.err
          out/scripts/dtc/dtc -@ -I dts -O dtb -o /tmp/a23.dtbo /tmp/a23.dts.tmp 2> /tmp/dtc.err
          echo "codigo de saida do dtc: $? (134 = abort)"
          grep -v "reg_format" /tmp/dtc.err | head -40
          echo "=== Backtrace (gdb) ==="
          gdb -batch -ex run -ex bt \
            --args out/scripts/dtc/dtc -@ -I dts -O dtb -o /tmp/a23.dtbo /tmp/a23.dts.tmp 2>&1 \
            | grep -v reg_format | tail -30

          echo "=== Comando real do make (V=1) ==="
          make O=out ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j1 V=1 arch/arm64/boot/dts/samsung/a23/a23/a23_eur_open_w00_r00.dtbo \
            > /tmp/one.log 2>&1
          grep -nE "dtc|See more|head" /tmp/one.log | cut -c1-400 | head -20
          tail -30 /tmp/one.log | cut -c1-300
          exit 0

      - name: Verify Kernel Image
        run: |
          echo "=== Arquivos gerados em boot/ ==="
          ls -lh out/arch/arm64/boot/ || true

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERRO: Image nao foi gerado, o build falhou."
            exit 1
          fi

          SIZE=$(stat -c%s out/arch/arm64/boot/Image)
          echo "Tamanho do Image: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERRO: Image pequeno demais, algo esta errado."
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: A23-Kernel-noKSU
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-noksu
          path: build.log
          if-no-files-found: ignore
